[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "mitochime"
version = "0.1.0"
description = "Pair-safe mitochondrial chimera detection workflow for Illumina reads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "pysam",
  "biopython",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
classical = ["xgboost", "lightgbm", "catboost"]
deep = ["torch"]
dev = ["pytest"]

[project.scripts]
mitochime = "mitochime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "mitochime"
version = "0.1.0"
description = "Pair-safe mitochondrial chimera detection workflow for Illumina reads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.2",
  "joblib",
  "pysam==0.22.1",
  "biopython==1.83",
  "pyyaml==6.0.1",
  "tqdm==4.66.4",
]

[project.optional-dependencies]
classical = ["xgboost==2.0.3", "lightgbm", "catboost"]
deep = ["torch"]
dev = ["pytest"]

[project.scripts]
mitochime = "mitochime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
